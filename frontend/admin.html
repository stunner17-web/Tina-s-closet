<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Tina's Closet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <section id="loginView" class="login-box">
    <h1>Admin Login</h1>
    <form id="loginForm">
      <label>Email
        <input type="email" id="email" required>
      </label>
      <label>Password
        <input type="password" id="password" required>
      </label>
      <p id="loginError" class="error"></p>
      <button type="submit">Log in</button>
    </form>
  </section>

  <section id="dashboardView" class="dashboard" hidden>
    <header class="admin-bar">
      <h1>Tina's Closet Admin</h1>
      <button id="logoutBtn">Log out</button>
    </header>
   <main> 

      <h2>Add product</h2>
      <form id="addForm" class="add-form">
        <label>Name
          <input type="text" id="pName" required>
        </label>
        <label>Category
          <select id="pCategory" required>
            <option>Dresses</option>
            <option>Native Wear</option>
            <option>Suits</option>
            <option>Tops</option>
          </select>
        </label>
        <label>Price ($, whole number)
          <input type="number" id="pPrice" min="1" step="1" required>
        </label>
        <label>Description
          <textarea id="pDescription" rows="3" required></textarea>
        </label>

        <!-- ADD FORM: quantity for each size (name = pSizeQty) -->
        <fieldset class="size-options">
          <legend>Quantity per size</legend>
          <label>8 <input type="number" name="pSizeQty" data-size="8" min="0" step="1" value="0"></label>
          <label>9 <input type="number" name="pSizeQty" data-size="9" min="0" step="1" value="0"></label>
          <label>10 <input type="number" name="pSizeQty" data-size="10" min="0" step="1" value="0"></label>
          <label>11 <input type="number" name="pSizeQty" data-size="11" min="0" step="1" value="0"></label>
          <label>12 <input type="number" name="pSizeQty" data-size="12" min="0" step="1" value="0"></label>
          <label>14 <input type="number" name="pSizeQty" data-size="14" min="0" step="1" value="0"></label>
        </fieldset>

        <label><input type="checkbox" id="pNew"> New Arrival</label>
        <label><input type="checkbox" id="pBest"> Best Seller</label>
        <label>Photo
          <input type="file" id="pImage" accept="image/png, image/jpeg, image/webp" required>
        </label>
        <p id="addMessage" class="error"></p>
        <button type="submit">Add product</button>
      </form>
      <h2>Products</h2>
      <div id="productList"></div>
      <h2>Orders</h2>
      <div id="orderList"></div>
    </main>
  </section> 


  <dialog id="editDialog">
    <form id="editForm">
      <h2>Edit product</h2>
      <input type="hidden" id="eId">
      <label>Name
        <input type="text" id="eName" required>
      </label>
      <label>Category
        <select id="eCategory" required>
          <option>Dresses</option>
          <option>Native Wear</option>
          <option>Suits</option>
          <option>Tops</option>
        </select>
      </label>
      <label>Price ($, whole number)
        <input type="number" id="ePrice" min="1" step="1" required>
      </label>
      <label>Description
        <textarea id="eDescription" rows="3" required></textarea> 
      </label> 

      <!-- EDIT DIALOG: quantity for each size (name = eSizeQty) -->
      <fieldset class="size-options">
        <legend>Quantity per size</legend>
        <label>8 <input type="number" name="eSizeQty" data-size="8" min="0" step="1" value="0"></label>
        <label>9 <input type="number" name="eSizeQty" data-size="9" min="0" step="1" value="0"></label>
        <label>10 <input type="number" name="eSizeQty" data-size="10" min="0" step="1" value="0"></label>
        <label>11 <input type="number" name="eSizeQty" data-size="11" min="0" step="1" value="0"></label>
        <label>12 <input type="number" name="eSizeQty" data-size="12" min="0" step="1" value="0"></label>
        <label>14 <input type="number" name="eSizeQty" data-size="14" min="0" step="1" value="0"></label>
      </fieldset>

      <label><input type="checkbox" id="eNew"> New Arrival</label>
       <label><input type="checkbox" id="eBest"> Best Seller</label>
      <p id="editMessage" class="error"></p>
      <div class="dialog-actions">
        <button type="button" id="cancelEdit" class="secondary-btn">Cancel</button>
        <button type="submit">Save changes</button>
      </div>
    </form>
  </dialog>

  <script src="js/admin.js"></script>
</body>
</html>
